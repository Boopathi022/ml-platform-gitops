apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-model
  namespace: default
  labels:
    app: fraud-model
    workload-type: ml-inference
    environment: dev
    platform.managed: "true"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fraud-model

  template:
    metadata:
      labels:
        app: fraud-model
        workload-type: ml-inference
        environment: dev
        platform.managed: "true"

    spec:
      containers:
        - name: fraud-model
          image: ghcr.io/company/fraud-model:v1

          resources:
            requests:
              cpu: 500m
              memory: 512Mi

            limits:
              cpu: 500m
              memory: 512Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-model-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-model-api
  template:
    metadata:
      labels:
        app: fraud-model-api
        workload-type: ml-inference
    spec:
      containers:
        - name: fraud-model-api
          image: nginx:latest
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi

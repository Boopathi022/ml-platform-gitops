apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-test
  namespace: default
  labels:
    app: platform-test
    workload-type: web
    environment: dev
    platform.managed: "true"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: platform-test

  template:
    metadata:
      labels:
        app: platform-test
        workload-type: web
        environment: dev
        platform.managed: "true"

    spec:
      containers:
        - name: platform-test
          image: nginx:1.27

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 100m
              memory: 128Mi
